state_dir: .state
audit_commands: false

limits:
  file_read_max_bytes: 262144
  file_write_max_bytes: 2097152
  patch_max_bytes: 2097152
  directory_list_max_entries: 500
  shell_output_max_bytes: 262144
  command_max_bytes: 65536
  job_log_read_max_bytes: 262144
  job_log_max_lines: 500
  job_stdin_max_bytes: 65536
  search_max_results: 200

jobs:
  launch_timeout_seconds: 5
  status_timeout_seconds: 5
  terminate_grace_seconds: 2

http:
  enabled: false
  host: 127.0.0.1
  port: 8000
  path: /mcp
  public_url: http://127.0.0.1:8000
  bearer_token_env: PERSONAL_LINUX_MCP_TOKEN

servers:
  server_a:
    # host may be a hostname or an OpenSSH Host alias.
    host: linux-a.example.net
    port: 22
    user: mcp-user
    # ssh_config: /home/mcp-gateway/.ssh/config
    identity_file: /home/mcp-gateway/.ssh/id_ed25519
    # Omit known_hosts to keep AsyncSSH's normal verified known-hosts behavior.
    # known_hosts: /home/mcp-gateway/.ssh/known_hosts
    allowed_roots:
      - /home/mcp-user/projects
    # Required conceptually for jobs; if omitted, a private default below the
    # first allowed root is used.
    job_root: /home/mcp-user/projects/.personal-linux-mcp/jobs
    max_concurrent_channels: 8
    connect_timeout_seconds: 15
    permissions:
      read: true
      write: true
      shell: true
      jobs: true
